name: Recipe build, adapters and installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:check
      - run: npm test

  dsh-consumer:
    name: dsh-consumer (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: rc.6
            target: .tmp/dsh-sdk
            manifest: adapters/dsh/consumer
            artifact: dsh-consumer-npm-logs
          - label: 0.2
            target: .tmp/dsh-sdk-0-2
            manifest: adapters/dsh/consumer-0.2
            artifact: dsh-consumer-0-2-npm-logs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned DSH consumer SDK
        timeout-minutes: 3
        env:
          npm_config_cache: ${{ github.workspace }}/.tmp/dsh-npm-cache
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_retries: '1'
          npm_config_fetch_timeout: '20000'
        run: |
          mkdir -p ${{ matrix.target }}
          cp ${{ matrix.manifest }}/package{,-lock}.json ${{ matrix.target }}/
          npm ci --prefix ${{ matrix.target }} --ignore-scripts --no-audit --no-fund --timing --loglevel=http
      - run: npm run test:dsh
        env:
          DSH_PACKAGE_ROOT: ${{ github.workspace }}/${{ matrix.target }}
      - name: Upload npm diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .tmp/dsh-npm-cache/_logs/
          if-no-files-found: ignore
